[project]
name = "llm-math"
version = "0.2.0"
description = "Bare-LLM math solver and prompt-engineering framework. Single-shot LLM calls plus a registry of prompt templates, an A/B sweep runner, and a comparison report generator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "caysonyin" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "openpyxl>=3.1",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=2.0",
    "pyarrow>=12.0",
]
xlsx = ["pandas>=2.0", "pyarrow>=12.0", "openpyxl>=3.1"]

[project.scripts]
llm-math-run = "runtime.run:main"
llm-math-evaluate = "evaluation.evaluate:main"
llm-math-sweep = "runtime.prompt_sweep:main"
llm-math-compare-prompts = "evaluation.compare_prompts:main"
llm-math-evaluate-sweep = "evaluation.evaluate_sweep:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runtime*", "evaluation*", "shared*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
