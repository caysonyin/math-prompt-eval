[project]
name = "llm-math"
version = "0.2.0"
description = "Bare-LLM math solver and prompt-engineering framework. Single-shot LLM calls plus a registry of prompt templates, an A/B sweep runner, and a comparison report generator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "caysonyin" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "openpyxl>=3.1",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=2.0",
    "pyarrow>=12.0",
]
xlsx = ["pandas>=2.0", "pyarrow>=12.0", "openpyxl>=3.1"]

[project.scripts]
llm-math-run = "llm_math.run:main"
llm-math-evaluate = "llm_math.evaluate:main"
llm-math-compare = "llm_math.compare:main"
llm-math-sweep = "llm_math.prompt_sweep:main"
llm-math-compare-prompts = "llm_math.compare_prompts:main"
llm-math-evaluate-sweep = "llm_math.evaluate_sweep:main"
llm-math-convert = "llm_math.convert_benchmarks:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_math*"]
exclude = ["llm_math.tests*"]

[tool.pytest.ini_options]
testpaths = ["llm_math/tests"]
addopts = "-ra -q"
